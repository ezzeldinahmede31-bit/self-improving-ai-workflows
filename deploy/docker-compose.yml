# Open-source tool stack for "The Pragmatic JIT AI Automation Architect".
#   LiteLLM : model proxy + budget ceilings + auto-failover  (4000)
#   Prism   : OpenAPI -> live local mock server                (4010)
#   Qdrant  : ephemeral task-scoped vector collection host    (6333/6334)
# Run everything:   docker compose -f deploy/docker-compose.yml up -d
# Minimal (only Prism mock + LiteLLM, no vector store):
#   docker compose -f deploy/docker-compose.yml --profile mock-only up -d

services:
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    restart: unless-stopped
    profiles: [default, mock-only]

  api-mock-prism:
    image: stoplight/prism:4
    container_name: api-mock-prism
    ports:
      - "4010:4010"
    command:
      - mock
      - --host
      - 0.0.0.0
      - /tmp/api-spec.yaml
    volumes:
      - ./api-spec.yaml:/tmp/api-spec.yaml:ro
    restart: unless-stopped
    profiles: [default, mock-only]

  task-rag-qdrant:
    image: qdrant/qdrant
    container_name: task-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    profiles: [default]

  sandbox-runtime:
    # runtime for ExecutionSandbox when Docker-in-Docker is impractical:
    # gVisor provides kernel-level isolation for non-TEE code. This image is a
    # dockerfile-less placeholder image only used by the compose network so the
    # sandbox can `docker run` isolated test snippets.
    image: python:3.11-slim
    container_name: sandbox-runtime
    command: ["sleep", "infinity"]
    profiles: [default]
    restart: "no"

volumes:
  qdrant-data: