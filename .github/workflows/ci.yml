name: Community Sync CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] 2>/dev/null || pip install pytest pyyaml

      - name: Run skillopt-sleep experiment (validation gate)
        # NOTE: no venv/ on the runner (gitignored) — use system python with
        # the repo root on sys.path (vendored skillopt_sleep/ package).
        run: |
          python -m skillopt_sleep.experiments.run_experiment --persona researcher --assert-improves
          python -m skillopt_sleep.experiments.run_experiment --persona programmer --assert-improves
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}

      - name: Validate workflow schema (if n8n workflows changed)
        run: |
          if git diff --name-only origin/main | grep -q "\.json$"; then
            python scripts/build_gates_pipeline.py changed_workflows.json || true
          fi

      - name: Check for breaking changes
        run: |
          # deleted or renamed skills without a migration note
          DELETED_SKILLS=$(git diff --name-only --diff-filter=D origin/main | grep "^\.opencode/skills/.*/SKILL\.md$" || true)
          if [ -n "$DELETED_SKILLS" ]; then
            echo "⚠️  Deleted skills detected:"
            echo "$DELETED_SKILLS"
            echo "::warning::Deleted skills need migration guide in PR description"
          fi

      - name: Lint Python scripts
        run: |
          find scripts -name "*.py" -exec python -m py_compile {} \;

  # Note: no auto-merge for any PR — client contributions (and every PR)
  # require mandatory human review before merge, even when all checks are green.
  # Reason: automated checks cannot detect prompt injection in prose.

  notify:
    name: Notify on Failure
    needs: validate
    # PR-only: on push events there is no pull_request number to comment on.
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR with failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **CI Failed** — Check the "Validate Changes" job logs. Common issues:\n- skillopt-sleep experiment regression (held-out score dropped)\n- Breaking skill changes without migration\n- Python syntax errors\n\nFix locally and push to update this PR.'
            })