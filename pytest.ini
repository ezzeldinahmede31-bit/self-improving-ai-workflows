[pytest]
markers =
    e2e: live end-to-end tests against a real n8n instance (require RUN_LIVE_E2E=1)
    live: live tests spawning real `opencode run` worker sessions (require RUN_LIVE_WORKERS=1)
addopts = -m "not e2e and not live" -q
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
